        - heading "Our History" [level=1] [ref=f4e72]
        - paragraph [ref=f4e73]: Menelusuri jejak perjalanan Pondok Pesantren Darut Taufiq dalam dedikasinya membangun institusi pendidikan Islam terpadu yang berkualitas di Kota Bekasi.
      - generic [ref=f4e76]:
        - generic [ref=f4e77]:
          - img "Sejarah Darut Taufiq 1" [ref=f4e79]
          - img "Sejarah Darut Taufiq 2" [ref=f4e81]
          - img "Sejarah Darut Taufiq 3" [ref=f4e83]
        - generic [ref=f4e84]:
          - heading "Sejarah Berdirinya Darut Taufiq" [level=2] [ref=f4e86]
          - generic [ref=f4e87]:
            - paragraph [ref=f4e88]:
              - strong [ref=f4e89]: Pondok Pesantren Darut Taufiq
              - text: didirikan pada tahun 2016 dengan tujuan mulia untuk menghadirkan institusi pendidikan Islam yang unggul dan berkualitas di Kota Bekasi. Gagasan pendirian pondok pesantren ini berawal dari keinginan kuat untuk membangun lembaga pendidikan yang tidak hanya berfokus pada keunggulan aspek akademik semata, tetapi juga sangat mengedepankan pembentukan karakter Islami yang kokoh bagi para santrinya.
            - paragraph [ref=f4e90]: Sejak awal berdirinya, Pondok Pesantren Darut Taufiq berkomitmen secara penuh untuk mengintegrasikan kurikulum nasional dengan nilai-nilai murni Al-Qur'an dan As-Sunnah sesuai dengan pemahaman Salafush Shalih. Dalam perjalanannya, pondok pesantren ini terus mengalami perkembangan pesat melalui penambahan jenjang pendidikan terpadu, peningkatan sarana prasarana belajar mengajar, serta penerapan metode pembelajaran yang inovatif.
            - heading "Ciri Khas & Fokus Pendidikan" [level=3] [ref=f4e92]
            - paragraph [ref=f4e93]: "Untuk mencapai visi dan misi pendidikan tersebut, Pondok Pesantren Darut Taufiq mengusung konsep pendidikan terpadu dengan beberapa ciri khas utama, antara lain:"
            - list [ref=f4e94]:
              - listitem [ref=f4e95]:
                - strong [ref=f4e96]: "Multiple Intelligence:"
                - text: Kami meyakini bahwa setiap anak memiliki keistimewaan. Kami menerapkan pendekatan kecerdasan majemuk untuk menggali, menemukan, dan mengembangkan potensi serta bakat masing-masing santri.
              - listitem [ref=f4e97]:
                - strong [ref=f4e98]: "Pendidikan Karakter (ADMK):"
                - text: "Fokus utama kami adalah membentuk generasi yang berprestasi sekaligus berakhlak mulia melalui pilar ADMK:"
                - emphasis [ref=f4e99]: Akhlaqul Karimah, Disiplin, Mandiri, dan Kreatif
                - text: .
              - listitem [ref=f4e100]:
                - strong [ref=f4e101]: "Sistem Kelas Terpisah:"
                - text: Guna menciptakan lingkungan belajar yang lebih fokus, nyaman, kondusif, dan sesuai dengan batasan syariat Islam, kami menerapkan sistem kelas terpisah antara santriwan (laki-laki) dan santriwati (perempuan).
            - paragraph [ref=f4e102]: Dengan manajemen dan yayasan yang menaungi secara profesional, kami terus berupaya menjaga komitmen untuk senantiasa menyelenggarakan berbagai program pengembangan kompetensi pendidik dan memaksimalkan kegiatan kesiswaan. Pengelolaan pendidikan di Darut Taufiq selalu diupayakan agar tetap amanah, efektif, dan efisien demi melahirkan generasi pembangun umat.
